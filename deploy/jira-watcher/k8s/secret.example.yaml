apiVersion: v1
kind: Secret
metadata:
  name: jira-watcher-secrets
  namespace: jira-watcher
  labels:
    app.kubernetes.io/name: jira-watcher
    app.kubernetes.io/component: secrets
type: Opaque
# NE PAS remplir ce fichier avec de vraies valeurs — c'est un gabarit.
# Procédure de création du secret réel :
#
#   kubectl create secret generic jira-watcher-secrets \
#     --namespace jira-watcher \
#     --from-literal=jira-email=VOTRE_EMAIL_JIRA \
#     --from-literal=jira-api-token=VOTRE_TOKEN_API_JIRA \
#     --from-file=claude-credentials.json=/chemin/vers/.credentials.json \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Voir deploy/jira-watcher/README.md §3 pour la procédure complète.
stringData:
  jira-email: "PLACEHOLDER_JIRA_EMAIL"
  jira-api-token: "PLACEHOLDER_JIRA_API_TOKEN"
  claude-credentials.json: "PLACEHOLDER_CLAUDE_CREDENTIALS_JSON"
