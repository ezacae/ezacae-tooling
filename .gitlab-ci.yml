include:
  - project: 'ezacae/ezacae-ci-utils'
    ref: main
    file: 'gitlab-ci-common.yml'

# ---------------------------------------------------------------------------
# Build & push de l'image jira-watcher (deploy/jira-watcher/)
#
# Construite avec docker:dind (runners ezacae en mode docker-in-docker).
# Le job vit dans le stage intégré `.pre` pour NE PAS redéfinir la clé `stages`
# du template commun inclus ci-dessus (qu'on n'écrase donc pas).
#
# Contexte de build = racine du dépôt : le Dockerfile copie `plugins/` et
# `deploy/jira-watcher/`. L'image cible `${CI_REGISTRY_IMAGE}/jira-watcher`,
# référencée par k8s/cronjob.yaml.
#
# Déclenchement (uniquement si les fichiers pertinents changent) :
#   - pipeline de merge request → build de validation SANS push
#   - branche par défaut        → push des tags `<sha>` et `latest`
# ---------------------------------------------------------------------------
build-jira-watcher-image:
  stage: .pre
  image: "registry.gitlab.com/gitlab-org/cluster-integration/auto-build-image:v4.19.0"
  services:
    - docker:24.0.9-dind
  variables:
    DOCKERFILE_PATH: "deploy/jira-watcher/Dockerfile"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &jira_watcher_changes
        - deploy/jira-watcher/**/*
        - plugins/**/*
        - .gitlab-ci.yml
      variables:
        DO_PUSH: "false"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *jira_watcher_changes
  script:
    - |
      if [[ -z "$CI_COMMIT_TAG" ]]; then
        export CI_APPLICATION_REPOSITORY=${CI_APPLICATION_REPOSITORY:-$CI_REGISTRY_IMAGE/jira-watcher/$CI_COMMIT_REF_SLUG}
        export CI_APPLICATION_TAG=${CI_APPLICATION_TAG:-$CI_COMMIT_SHA}
      else
        export CI_APPLICATION_REPOSITORY=${CI_APPLICATION_REPOSITORY:-$CI_REGISTRY_IMAGE/jira-watcher}
        export CI_APPLICATION_TAG=${CI_APPLICATION_TAG:-$CI_COMMIT_TAG}
      fi
    - unset HTTP_PROXY
    - unset HTTPS_PROXY
    - bash -xe /build/build.sh

# ---------------------------------------------------------------------------
# Tests shell des plugins (bash + jq, 100% hors-ligne, aucun credential requis).
#
# Aucun job ne les lançait jusqu'ici : la garantie de non-régression de la
# conversion ADF (RD-23) reposait sur un test que personne n'exécutait.
#
# Le job vit dans le stage intégré `.pre` pour NE PAS redéfinir la clé `stages`
# du template commun inclus plus haut — même précaution que le job d'image.
#
# `versions.lock` est dans la liste `changes` (RD-22) : une MR ne touchant
# que ce fichier doit déclencher le job, sinon un écart avec les plugin.json
# du dépôt passerait sans contrôle. Le mode --check du contrôle de dérive de
# version est lancé en fin de script, sur la racine du dépôt (déduite de
# l'emplacement du script, pas de $CI_PROJECT_DIR).
# ---------------------------------------------------------------------------
test-plugins-shell:
  stage: .pre
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &plugin_shell_changes
        - plugins/**/*
        - versions.lock
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *plugin_shell_changes
  before_script:
    # git : requis par plugins/ezacae-dev/tests/test-references-orphelines.sh
    # (invariant référentiel post-fusion john+morgan → developer), pas par les
    # tests RD-22 — constaté en vérifiant ce job sous alpine:3.20 avant de
    # l'introduire ici (il n'existait sur aucune branche fusionnée jusqu'ici).
    - apk add --no-cache bash jq git
  script:
    - |
      status=0
      for t in plugins/*/tests/test[-_]*.sh; do
        echo "=== $t"
        bash "$t" || status=1
      done
      echo "=== plugins/ezacae-base/hooks/check-ezacae-versions.sh --check"
      bash plugins/ezacae-base/hooks/check-ezacae-versions.sh --check || status=1
      exit $status
